<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#272c33">
  <meta name="robots" content="noindex, nofollow">
  <title>ورود به اتاق فرمان | رسانه میم</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23272c33'/%3E%3Ccircle cx='32' cy='32' r='11' fill='none' stroke='%23e9b872' stroke-width='5'/%3E%3Ccircle cx='46' cy='18' r='4' fill='%23e9b872'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="adm is-checking">

  <div class="bg" aria-hidden="true">
    <span class="bg__blob bg__blob--a"></span>
    <span class="bg__blob bg__blob--b"></span>
    <span class="bg__blob bg__blob--c"></span>
    <span class="bg__noise"></span>
  </div>

  <main class="login">
    <section class="card login__card" id="card" aria-labelledby="login-title">
      <div class="login__mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" width="104" height="104">
          <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <circle cx="60" cy="60" r="22" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
          <g class="login__spin"><circle cx="60" cy="14" r="6" fill="var(--accent)"/></g>
        </svg>
      </div>

      <header class="login__head">
        <span class="eyebrow">فقط مدیر سایت</span>
        <h1 class="login__title" id="login-title">ورود به اتاق فرمان</h1>
        <p class="login__sub">برای مدیریت آثار، تماس، مهارت‌ها و متن‌های سایت وارد شوید.</p>
      </header>

      <form class="login__form" id="form" novalidate>
        <label class="field">
          <span>ایمیل مدیر</span>
          <input class="input input--ltr" id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin@example.com" required autofocus>
        </label>
        <label class="field">
          <span>رمز عبور</span>
          <div class="login__pass">
            <input class="input input--ltr" id="pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
            <button class="login__eye" type="button" id="eye" aria-label="نمایش یا پنهان کردن رمز" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
        </label>
        <p class="login__err" id="err" role="alert" aria-live="assertive"></p>
        <button class="pill pill--accent login__btn" id="btn" type="submit"><span>ورود</span></button>
      </form>

      <a class="login__back" href="../">بازگشت به سایت</a>
    </section>
  </main>

  <script src="../vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../store.js"></script>
  <script src="login.js"></script>
</body>
</html>
